name: Generate contribution snake

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/snake.yml'
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate coffee-colored contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: guigoviajante
          outputs: |
            dist/github-snake.svg?color_snake=%23D7A879&color_dots=%23211D1A,%23453629,%23634A35,%239A704D,%23D7A879

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
